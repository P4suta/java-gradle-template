---
name: Bug report
description: Report a problem with the template
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / mise & JDK version / Docker or not
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant just build / just lint output
      render: shell
    validations:
      required: false
