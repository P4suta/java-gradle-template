org.gradle.parallel=true
org.gradle.caching=true

# Off: the SpotBugs plugin is not configuration-cache compatible and hangs with it enabled.
org.gradle.configuration-cache=false

# file.encoding=UTF-8 avoids platform-default charset issues (Windows) during I/O.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

org.gradle.welcome=never

# Solution (src/main) compile target. Override per submission: -PjavaRelease=8  (range 8..21).
# Tools, tests, and the toolchain stay on JDK 21; only the produced bytecode/API level changes.
javaRelease=21
