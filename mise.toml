# Project-pinned tools. Global CLIs live in your own dotfiles; this pins what the repo needs.
# Setup: `mise trust && mise install`, then `just setup`.
# Gradle comes from the committed wrapper.

[tools]
# Match the judge runtime (Amazon Corretto 21); the code is JDK-vendor-neutral.
java = "corretto-21"

just = "1.59.0"
lefthook = "2.2.2"

# Lint tools invoked by the lefthook pre-commit hook.
"github:crate-ci/typos" = "1.51.1"
taplo = "0.10.0"
shellcheck = "0.11.0"
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
hadolint = "2.15.1"

uv = "0.13.5"
yamllint = "1.38.0"
zizmor = "1.31.1"

[settings]
experimental = true
